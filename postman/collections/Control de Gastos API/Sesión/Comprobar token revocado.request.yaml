$kind: http-request
url: "{{baseUrl}}/api/usuario"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('El access token revocado obtiene 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 2000
