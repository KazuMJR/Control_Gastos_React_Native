$kind: http-request
url: "{{baseUrl}}/api/categorias"
method: POST
headers:
  Accept: application/json
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nombre": "Prueba {{runSuffix}}",
      "color": "#F97316"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Categoría creada con 201', () => pm.response.to.have.status(201));
      const body = pm.response.json();
      pm.expect(body.id).to.be.a('number');
      pm.collectionVariables.set('categoriaId', body.id);
    language: text/javascript
order: 1000
