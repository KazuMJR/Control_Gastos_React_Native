$kind: http-request
url: "{{baseUrl}}/api/categorias"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{limitedToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Token con categorias.read obtiene 200', () => pm.response.to.have.status(200));
      pm.expect(pm.response.json()).to.be.an('array');
    language: text/javascript
order: 1000
