$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{runEmail}}",
      "password": "{{runPassword}}",
      "device_name": "Postman"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Login devuelve 200 y token Passport', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.expect(body.token).to.be.a('string').and.not.empty;
    language: text/javascript
order: 2000
