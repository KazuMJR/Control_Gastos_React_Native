$kind: http-request
url: "{{baseUrl}}/oauth/token"
method: POST
headers:
  Accept: application/json
body:
  type: urlencoded
  content:
    - key: grant_type
      value: refresh_token
    - key: client_id
      value: "{{clientId}}"
    - key: client_secret
      value: "{{clientSecret}}"
    - key: refresh_token
      value: "{{refreshToken}}"
    - key: scope
      value: "{{fullScopes}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Refresh token renueva la sesión OAuth', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.expect(body.access_token).to.be.a('string').and.not.empty;
      pm.expect(body.refresh_token).to.be.a('string').and.not.empty;
      pm.expect(body.expires_in).to.eql(3600);
      pm.collectionVariables.set('token', body.access_token);
      pm.collectionVariables.set('refreshToken', body.refresh_token);
    language: text/javascript
order: 5000
