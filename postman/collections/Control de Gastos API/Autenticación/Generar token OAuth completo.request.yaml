$kind: http-request
url: "{{baseUrl}}/oauth/token"
method: POST
headers:
  Accept: application/json
body:
  type: urlencoded
  content:
    - key: grant_type
      value: password
    - key: client_id
      value: "{{clientId}}"
    - key: client_secret
      value: "{{clientSecret}}"
    - key: username
      value: "{{runEmail}}"
    - key: password
      value: "{{runPassword}}"
    - key: scope
      value: "{{fullScopes}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('OAuth devuelve access_token y refresh_token con todos los scopes', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.expect(body.access_token).to.be.a('string').and.not.empty;
      pm.expect(body.refresh_token).to.be.a('string').and.not.empty;
      pm.expect(body.expires_in).to.eql(3600);
      pm.collectionVariables.set('token', body.access_token);
      pm.collectionVariables.set('refreshToken', body.refresh_token);
    language: text/javascript
order: 4000
