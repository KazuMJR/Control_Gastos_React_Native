$kind: http-request
url: "{{baseUrl}}/api/gastos"
method: POST
headers:
  Accept: application/json
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "categoria_id": {{categoriaId}},
      "descripcion": "Almuerzo",
      "monto": 45.50,
      "fecha_gasto": "2026-08-18",
      "notas": "Prueba desde Postman"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Gasto creado con 201', () => pm.response.to.have.status(201));
      const body = pm.response.json();
      pm.expect(body.id).to.be.a('number');
      pm.collectionVariables.set('gastoId', body.id);
    language: text/javascript
order: 1000
