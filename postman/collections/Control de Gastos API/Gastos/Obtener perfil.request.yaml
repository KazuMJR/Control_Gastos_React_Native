$kind: http-request
url: "{{baseUrl}}/api/usuario"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Perfil devuelve 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.expect(body.email).to.eql(pm.collectionVariables.get('runEmail'));
      pm.expect(body.scopes).to.include.members(['perfil.read', 'categorias.write', 'gastos.delete']);
    language: text/javascript
order: 5000
