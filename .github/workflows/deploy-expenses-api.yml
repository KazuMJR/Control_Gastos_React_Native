name: Publicar API de gastos en Azure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite, pdo_mysql, openssl
          coverage: none

      - name: Instalar dependencias de Laravel
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Ejecutar pruebas
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan passport:keys --force
          touch database/database.sqlite
          php artisan test

      - name: Preparar paquete de producción
        working-directory: backend
        run: |
          composer install --prefer-dist --no-dev --no-interaction --no-progress --optimize-autoloader
          rm -f .env database/database.sqlite

      - name: Publicar en Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend
